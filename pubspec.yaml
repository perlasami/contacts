name: contacts_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.4
  lottie: ^3.3.1
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animation/

flutter_native_splash:
  color: "#29384D"
  image: assets/images/splash5.png
  fullscreen: true

  android_12:
    color: "#29384D"
    image: assets/images/splash5.png